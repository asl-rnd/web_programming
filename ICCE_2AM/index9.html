<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Programming | Id</title>
</head>
<body>
    <form action="#" method="post">
        <label>Name: </label>
        <input placeholder="Enter your name" required><br><br>

        <label>Email: </label>
        <input required><br><br>

        <label>Phone: </label>
        <input><br><br>

        <label>Password: </label>
        <input required><br><br>

        <label>Gender: </label>
        <input type="radio" name="gender" value="male">Male
        <input type="radio" name="gender" value="female">Female<br><br>

        <label>Home Town: </label>
        <select>
            <option>Noakhali</option>
            <option>Barisal</option>
            <option>Cumilla</option>
            <option>Raozan</option>
            <option>Feni</option>
        </select><br><br>

        <label>Hobbies: </label>
        <input type="checkbox" name="hobby" value="reading">Reading
        <input type="checkbox" name="hobby" value="traveling">Traveling
        <input type="checkbox" name="hobby" value="swimming">Swimming<br><br>

        <label>Message: </label><br>
        <textarea rows="4" cols="30" placeholder="Enter your message" maxlength="15"></textarea><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
